<!doctype html>
<!-- Source for the link-preview image (assets/og-image.jpg) and app icons.
     Open via a local server and screenshot: ?v=og (1200x630) or ?v=icon (512x512). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600;700&family=Mukta:wght@500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: Mukta, sans-serif; color: #fbf6ec; background: #1f0907; }
  .og img { position: absolute; right: 0; top: 0; width: 760px; height: 630px; object-fit: cover; }
  .og .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #1f0907 40%, rgba(31,9,7,.85) 52%, rgba(31,9,7,0) 78%); }
  .og .txt { position: absolute; left: 72px; top: 48px; width: 600px; }
  .og svg { width: 64px; height: 64px; color: #e9cf86; }
  .og .eyebrow { font-family: Cinzel, serif; letter-spacing: .2em; font-size: 20px; color: #e9cf86; margin: 22px 0 6px; }
  .og h1 { font-family: "Cormorant Garamond", serif; font-weight: 700; font-size: 84px; line-height: .95; margin: 0; }
  .og .hi { font-family: "Tiro Devanagari Hindi", serif; font-size: 40px; color: #e9cf86; margin: 8px 0 18px; }
  .og p { font-size: 26px; line-height: 1.4; margin: 0 0 26px; color: rgba(251,246,236,.9); }
  .og .pill { display: inline-block; background: #168a45; color: #fff; font-weight: 600; font-size: 26px; padding: 12px 26px; border-radius: 999px; }

  .icon { width: 512px; height: 512px; background: radial-gradient(circle at 50% 35%, #5b1a16, #3a120f 60%, #2a0d0b); display: grid; place-items: center; }
  .icon svg { width: 360px; height: 360px; color: #e9cf86; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 2.5v8" stroke-width="1.6"/>
      <path d="M24 3l7.5 2.6L24 8.2" fill="#e2731f" stroke="#e2731f" stroke-width="1.2"/>
      <circle cx="24" cy="12.6" r="1.9" fill="currentColor" stroke="none"/>
      <path d="M13 34.5C13 25.5 18 18.6 24 15c6 3.6 11 10.5 11 19.5z" stroke-width="2"/>
      <path d="M17.2 25.5h13.6M15.2 30h17.6M24 15v19.5" stroke-width="1.3" opacity=".75"/>
      <path d="M9.5 34.5h29v3.5h-29z" stroke-width="2"/>
      <path d="M5 43c3-2.4 6-2.4 9 0s6 2.4 9 0 6-2.4 9 0 6 2.4 9 0" stroke-width="1.8"/>
    </g>
  </symbol>
</svg>
<div class="og" id="og">
  <img src="../site/assets/img/room-teal-wide-960.webp" alt="">
  <div class="shade"></div>
  <div class="txt">
    <svg viewBox="0 0 48 48"><use href="#mark"/></svg>
    <div class="eyebrow">OMKARESHWAR · MADHYA PRADESH</div>
    <h1>Hotel Shree Shivay</h1>
    <div class="hi">होटल श्री शिवाय</div>
    <p>AC &amp; Non-AC rooms, a 7-minute walk from Mamleshwar Jyotirlinga</p>
    <span class="pill">WhatsApp 88279 95348</span>
  </div>
</div>
<div class="icon" id="icon"><svg viewBox="0 0 48 48"><use href="#mark"/></svg></div>
<script>
  var v = new URLSearchParams(location.search).get("v") || "og";
  document.getElementById(v === "og" ? "icon" : "og").remove();
</script>
</body>
</html>
